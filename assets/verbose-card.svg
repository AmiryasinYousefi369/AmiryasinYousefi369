<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="436" viewBox="0 0 900 436">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14">
        <animate attributeName="stop-color"
                 values="#39FF14;#58a6ff;#39FF14"
                 dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58a6ff">
        <animate attributeName="stop-color"
                 values="#58a6ff;#39FF14;#58a6ff"
                 dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="0.8" fill="#39FF14" opacity="0.5">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="70" r="0.6" fill="#58a6ff" opacity="0.4">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="100" r="0.7" fill="#39FF14" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="100" cy="20" r="0.5" fill="#c9d1d9" opacity="0.4">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="10" cy="80" r="0.6" fill="#58a6ff" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.5s" repeatCount="indefinite"/>
      </circle>
    </pattern>

    <clipPath id="cardClip">
      <rect width="900" height="436" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .bg { fill: #0d1117; }
    .border {
      fill: none;
      stroke: url(#borderGrad);
      stroke-width: 1.5;
      opacity: 0.9;
    }
    .title { font-family: 'Courier New', monospace; font-size: 13px; fill: #8b949e; }
    .user {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      font-weight: bold;
      fill: #39FF14;
      filter: url(#glow);
    }
    .dashes { font-family: 'Courier New', monospace; font-size: 13px; fill: #30363d; }
    .label {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #39FF14;
    }
    .value {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      fill: #c9d1d9;
    }
    .footer {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      fill: #58a6ff;
      text-anchor: end;
      filter: url(#softGlow);
    }
    .cursor {
      fill: #39FF14;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    .flicker {
      animation: flicker 8s infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.85; }
      94% { opacity: 1; }
      97% { opacity: 0.92; }
      98% { opacity: 1; }
    }
  </style>

  <!-- کارت پس‌زمینه -->
  <g clip-path="url(#cardClip)">
    <rect class="bg" width="900" height="436" rx="10"/>
    <rect width="900" height="436" fill="url(#stars)"/>

    <!-- خط اسکن CRT -->
    <rect x="0" y="0" width="900" height="3" fill="#39FF14" opacity="0.12">
      <animate attributeName="y" values="-10;446" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- گرادیانت بالای کارت -->
    <rect x="0" y="0" width="900" height="80" fill="#39FF14" opacity="0.03">
      <animate attributeName="opacity" values="0.02;0.06;0.02" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect class="border" x="0.5" y="0.5" width="899" height="435" rx="10"/>

  <g class="flicker">
    <!-- عنوان -->
    <text x="28" y="30" class="title">
      AmiryasinYousefi369: ~ — neofetch
    </text>

    <!-- نام کاربری + مکان‌نما -->
    <text x="28" y="46" class="user">AmiryasinYousefi369</text>
    <rect class="cursor" x="216" y="34" width="9" height="14"/>

    <text x="28" y="60" class="dashes">------------</text>

    <!-- خطوط اطلاعات با انیمیشن fade-in -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
      <text x="28" y="70" class="label">Now:</text>
      <text x="190" y="70" class="value">Learning &amp; Building real projects</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
      <text x="28" y="116" class="label">Prev:</text>
      <text x="190" y="116" class="value">Starting my journey in web development</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.6s" fill="freeze"/>
      <text x="28" y="162" class="label">Stack:</text>
      <text x="190" y="162" class="value">Currently learning — skills will be added over time</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.1s" fill="freeze"/>
      <text x="28" y="208" class="label">Highlights:</text>
      <text x="190" y="208" class="value">Building personal projects &amp; experimenting</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.6s" fill="freeze"/>
      <text x="28" y="254" class="label">Learning:</text>
      <text x="190" y="254" class="value">Web Development</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.1s" fill="freeze"/>
      <text x="28" y="300" class="label">Reach:</text>
      <text x="190" y="300" class="value">shop.ario-co.ir · tonystarkicu1@gmail.com</text>
    </g>

    <!-- پالت رنگی با انیمیشن -->
    <rect x="28" y="356" width="22" height="22" rx="3"
          fill="#161b22" stroke="#30363d" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.6s" fill="freeze"/>
    </rect>
    <rect x="58" y="356" width="22" height="22" rx="3"
          fill="#0e4429" stroke="#30363d" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.7s" fill="freeze"/>
    </rect>
    <rect x="88" y="356" width="22" height="22" rx="3"
          fill="#006d32" stroke="#30363d" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.8s" fill="freeze"/>
    </rect>
    <rect x="118" y="356" width="22" height="22" rx="3"
          fill="#26a641" stroke="#30363d" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.9s" fill="freeze"/>
    </rect>
    <rect x="148" y="356" width="22" height="22" rx="3"
          fill="#39d353" stroke="#30363d" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.0s" fill="freeze"/>
      <animate attributeName="fill"
               values="#39d353;#58ff7a;#39d353"
               dur="2s" begin="4.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="178" y="356" width="22" height="22" rx="3"
          fill="#58a6ff" stroke="#30363d" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.1s" fill="freeze"/>
      <animate attributeName="fill"
               values="#58a6ff;#8ec5ff;#58a6ff"
               dur="2s" begin="4.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="208" y="356" width="22" height="22" rx="3"
          fill="#c9d1d9" stroke="#30363d" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.2s" fill="freeze"/>
    </rect>

    <!-- footer -->
    <text x="872" y="406" class="footer" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="4.5s" fill="freeze"/>
      ./whoami --verbose
    </text>
  </g>

  <!-- چراغ‌های ترمینال بالای راست -->
  <circle cx="860" cy="22" r="4" fill="#ff5f56" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="845" cy="22" r="4" fill="#ffbd2e" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="22" r="4" fill="#27c93f" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>

</svg>
