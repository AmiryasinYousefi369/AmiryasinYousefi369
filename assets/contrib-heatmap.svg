<svg xmlns="http://www.w3.org/2000/svg" width="816" height="280" viewBox="0 0 816 280" role="img" aria-label="Now Playing music panel">
  <defs>
    <!-- گرادیانت حاشیه متحرک -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14">
        <animate attributeName="stop-color" values="#39FF14;#58a6ff;#39FF14" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#26a641">
        <animate attributeName="stop-color" values="#26a641;#39FF14;#26a641" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#39FF14;#58a6ff" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- گرادیانت کاور آلبوم -->
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7;#00b4d8;#7b2ff7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00b4d8">
        <animate attributeName="stop-color" values="#00b4d8;#7b2ff7;#00b4d8" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- گرادیانت نوار پیشرفت -->
    <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="50%" stop-color="#26a641"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <!-- گرادیانت عنوان -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9d1d9">
        <animate attributeName="offset" values="-0.5;1.5" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#39FF14">
        <animate attributeName="offset" values="0.5;2.5" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect width="816" height="280" rx="12"/>
    </clipPath>

    <!-- clipPath برای نوار پیشرفت متحرک -->
    <clipPath id="progressClip">
      <rect x="120" y="238" width="0" height="4" rx="2">
        <animate attributeName="width" from="0" to="420" dur="3s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>

    <style>
      .bg { fill: #0d1117; }
      .border {
        fill: none;
        stroke: url(#borderGrad);
        stroke-width: 1.2;
      }
      .header-text {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .title {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: bold;
        fill: url(#titleGrad);
        filter: url(#glow);
      }
      .artist {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #8b949e;
      }
      .album {
        font-family: 'Courier New', monospace;
        font-size: 10px;
        fill: #6e7681;
      }
      .time {
        font-family: 'Courier New', monospace;
        font-size: 9px;
        fill: #6e7681;
      }
      .time-current {
        fill: #39FF14;
        font-weight: bold;
      }
      .status {
        font-family: 'Courier New', monospace;
        font-size: 10px;
        fill: #39FF14;
      }
      .eq-bar {
        fill: #39FF14;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      @keyframes flicker {
        0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:0.96} 94%{opacity:1}
      }
      .flicker { animation: flicker 9s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flicker { animation: none; }
      }
    </style>
  </defs>

  <!-- ═══ پس‌زمینه ═══ -->
  <g clip-path="url(#cardClip)">
    <rect class="bg" width="816" height="280" rx="12"/>

    <!-- هاله‌ی بنفش-آبی بالای کارت -->
    <rect x="0" y="0" width="816" height="120" fill="#7b2ff7" opacity="0.05">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- موج پس‌زمینه -->
    <path d="M0 200 Q 100 170 200 200 T 400 200 T 600 200 T 816 200 L 816 280 L 0 280 Z"
          fill="#39FF14" opacity="0.02">
      <animate attributeName="d"
               values="M0 200 Q 100 170 200 200 T 400 200 T 600 200 T 816 200 L 816 280 L 0 280 Z;
                       M0 200 Q 100 230 200 200 T 400 200 T 600 200 T 816 200 L 816 280 L 0 280 Z;
                       M0 200 Q 100 170 200 200 T 400 200 T 600 200 T 816 200 L 816 280 L 0 280 Z"
               dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- ذرات موسیقی شناور -->
    <g opacity="0.6">
      <circle cx="150" cy="250" r="1.5" fill="#39FF14">
        <animate attributeName="cy" values="280;60" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="150;180;150" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="400" cy="250" r="1" fill="#58a6ff">
        <animate attributeName="cy" values="280;80" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="400;380;400" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="650" cy="250" r="1.2" fill="#7b2ff7">
        <animate attributeName="cy" values="290;100" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="750" cy="250" r="1" fill="#69f0a0">
        <animate attributeName="cy" values="280;70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="750;770;750" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- خط اسکن CRT -->
    <rect x="0" y="0" width="816" height="2" fill="#39FF14" opacity="0.1">
      <animate attributeName="y" values="-5;285" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ═══ حاشیه ═══ -->
  <rect class="border" x="0.5" y="0.5" width="815" height="279" rx="12"/>

  <!-- ═══ هدر ═══ -->
  <g class="flicker">
    <circle cx="20" cy="20" r="4.5" fill="#ff5f56"/>
    <circle cx="36" cy="20" r="4.5" fill="#ffbd2e"/>
    <circle cx="52" cy="20" r="4.5" fill="#27c93f"/>

    <text x="70" y="25" class="header-text">
      <tspan fill="#39FF14" font-weight="bold">♫ NOW PLAYING</tspan>
      <tspan> — spotify://amiryasin</tspan>
    </text>

    <!-- LIVE indicator -->
    <circle cx="755" cy="20" r="4" fill="#ff5f56">
      <animate attributeName="r" values="4;5.2;4" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="755" cy="20" r="4" fill="none" stroke="#ff5f56" stroke-width="1">
      <animate attributeName="r" values="4;14" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="745" y="24" text-anchor="end" class="header-text" fill="#ff5f56" font-size="9" font-weight="bold">● LIVE</text>
  </g>

  <line x1="0" y1="36" x2="816" y2="36" stroke="#21262d" stroke-width="0.8"/>

  <!-- ═══ کاور آلبوم ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>

    <!-- کاور -->
    <rect x="40" y="60" width="140" height="140" rx="10" fill="url(#coverGrad)" stroke="#21262d" stroke-width="1"/>

    <!-- آیکون موسیقی داخل کاور -->
    <g transform="translate(110 130)" filter="url(#glow)">
      <circle cx="0" cy="0" r="28" fill="#0d1117" opacity="0.4"/>
      <text x="0" y="8" text-anchor="middle" font-family="'Courier New', monospace" font-size="32" fill="#fff" font-weight="bold">♫</text>
    </g>

    <!-- نوار "پخش" متحرک روی کاور -->
    <rect x="40" y="60" width="140" height="3" fill="#39FF14" opacity="0.6">
      <animate attributeName="y" values="60;197;60" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- نقطه‌های تزئینی کاور -->
    <circle cx="52" cy="72" r="1.5" fill="#fff" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="72" r="1.5" fill="#fff" opacity="0.3">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="188" r="1.5" fill="#fff" opacity="0.3">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="168" cy="188" r="1.5" fill="#fff" opacity="0.3">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ═══ اطلاعات آهنگ ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>

    <!-- عنوان آهنگ -->
    <text x="200" y="82" font-family="'Courier New', monospace" font-size="9" fill="#6e7681" letter-spacing="1">▶ TRACK</text>
    <text x="200" y="106" class="title">Midnight Dreams</text>

    <!-- آرتیست -->
    <text x="200" y="126" class="artist">— Amiryasin × JENESYX</text>

    <!-- آلبوم -->
    <text x="200" y="144" class="album">Album: Nocturnal Sessions · 2024</text>

    <!-- اکولایزر ۲۴ ستونی -->
    <g transform="translate(200 158)">
      <rect class="eq-bar" x="0" y="10" width="2" height="4" rx="1">
        <animate attributeName="height" values="4;14;6;12;4" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;0;8;2;10" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="6" y="6" width="2" height="8" rx="1">
        <animate attributeName="height" values="8;16;4;14;8" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;-2;10;0;6" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="12" y="2" width="2" height="12" rx="1">
        <animate attributeName="height" values="12;18;6;16;12" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;-6;8;-2;2" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="18" y="8" width="2" height="6" rx="1">
        <animate attributeName="height" values="6;16;8;14;6" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;-2;6;0;8" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="24" y="4" width="2" height="10" rx="1">
        <animate attributeName="height" values="10;18;4;12;10" dur="0.75s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;-6;10;2;4" dur="0.75s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="30" y="12" width="2" height="2" rx="1">
        <animate attributeName="height" values="2;12;6;10;2" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="y" values="12;0;6;2;12" dur="0.85s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="36" y="6" width="2" height="8" rx="1">
        <animate attributeName="height" values="8;16;6;14;8" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;-4;8;0;6" dur="0.95s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="42" y="0" width="2" height="14" rx="1">
        <animate attributeName="height" values="14;18;8;16;14" dur="0.65s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0;-4;6;-2;0" dur="0.65s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="48" y="8" width="2" height="6" rx="1">
        <animate attributeName="height" values="6;14;8;12;6" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;0;6;2;8" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="54" y="4" width="2" height="10" rx="1">
        <animate attributeName="height" values="10;16;6;14;10" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;-2;8;0;4" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="60" y="10" width="2" height="4" rx="1">
        <animate attributeName="height" values="4;12;6;10;4" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;2;8;4;10" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="66" y="2" width="2" height="12" rx="1">
        <animate attributeName="height" values="12;18;8;16;12" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;-4;6;-2;2" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="72" y="6" width="2" height="8" rx="1">
        <animate attributeName="height" values="8;14;4;12;8" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;-2;10;0;6" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="78" y="0" width="2" height="14" rx="1">
        <animate attributeName="height" values="14;18;10;16;14" dur="0.75s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0;-4;4;-2;0" dur="0.75s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="84" y="8" width="2" height="6" rx="1">
        <animate attributeName="height" values="6;16;8;14;6" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;-2;6;0;8" dur="0.85s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="90" y="4" width="2" height="10" rx="1">
        <animate attributeName="height" values="10;18;6;14;10" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;-6;8;0;4" dur="0.95s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="96" y="10" width="2" height="4" rx="1">
        <animate attributeName="height" values="4;14;8;12;4" dur="0.65s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;-2;6;2;10" dur="0.65s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="102" y="2" width="2" height="12" rx="1">
        <animate attributeName="height" values="12;16;6;14;12" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;-2;10;0;2" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="108" y="6" width="2" height="8" rx="1">
        <animate attributeName="height" values="8;18;4;16;8" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;-6;10;-2;6" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="114" y="8" width="2" height="6" rx="1">
        <animate attributeName="height" values="6;14;8;12;6" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;0;6;2;8" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="120" y="0" width="2" height="14" rx="1">
        <animate attributeName="height" values="14;18;8;16;14" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0;-4;6;-2;0" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="126" y="4" width="2" height="10" rx="1">
        <animate attributeName="height" values="10;16;6;14;10" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;-2;8;0;4" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="132" y="10" width="2" height="4" rx="1">
        <animate attributeName="height" values="4;12;6;10;4" dur="0.75s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;2;8;4;10" dur="0.75s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="138" y="6" width="2" height="8" rx="1">
        <animate attributeName="height" values="8;14;4;12;8" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;-2;10;0;6" dur="0.85s" repeatCount="indefinite"/>
      </rect>
      <rect class="eq-bar" x="144" y="2" width="2" height="12" rx="1">
        <animate attributeName="height" values="12;18;8;16;12" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;-6;6;-2;2" dur="0.95s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- برچسب "Playing" کنار اکولایزر -->
    <text x="360" y="168" font-family="'Courier New', monospace" font-size="8" fill="#39FF14" opacity="0.7">▮ PLAYING</text>
  </g>

  <!-- ═══ نوار پیشرفت ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>

    <!-- زمان جاری -->
    <text x="40" y="248" class="time time-current">1:42</text>

    <!-- نوار پس‌زمینه -->
    <rect x="120" y="238" width="460" height="4" rx="2" fill="#21262d"/>

    <!-- نوار پیشرفت (متحرک) -->
    <rect x="120" y="238" width="0" height="4" rx="2" fill="url(#progressGrad)">
      <animate attributeName="width" values="0;460" dur="4s" fill="freeze"/>
    </rect>

    <!-- نقطه‌ی knob -->
    <circle cx="120" cy="240" r="6" fill="#39FF14" filter="url(#glow)">
      <animate attributeName="cx" values="120;580" dur="4s" fill="freeze"/>
    </circle>

    <!-- زمان کل -->
    <text x="596" y="248" class="time">3:52</text>

    <!-- کنترل‌ها -->
    <g filter="url(#glow)">
      <!-- Previous -->
      <g opacity="0.7">
        <circle cx="720" cy="240" r="12" fill="#161b22" stroke="#30363d"/>
        <text x="720" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">⏮</text>
      </g>

      <!-- Play/Pause (بزرگ‌تر) -->
      <g>
        <circle cx="752" cy="240" r="15" fill="#39FF14">
          <animate attributeName="r" values="15;16;15" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="752" y="246" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#0d1117" font-weight="bold">⏸</text>
      </g>

      <!-- Next -->
      <g opacity="0.7">
        <circle cx="784" cy="240" r="12" fill="#161b22" stroke="#30363d"/>
        <text x="784" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#c9d1d9">⏭</text>
      </g>
    </g>
  </g>

  <!-- ═══ Footer ═══ -->
  <text x="796" y="268" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#58a6ff" opacity="0.7" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    spotify.com/user/amiryasin
  </text>

</svg>
